description: "This dataset contains 8000x transmission EM images of the Corpus Callosum
  in two groups of mice. The main goal of this project is to study unmyelinated axons.
  The technique used to prepare the samples is high pressure freezing and freeze substitution.
  This results in high-definition images where unmyelinated axons are remarkably visible.
  Imaging was done at UC Berkeley. This data was originally used in https://www.pnas.org/doi/10.1073/pnas.2307250121.
  The two mice groups are Wild Type (WT) and SRF conditional knockout (KO). There
  are 5 animals per group for a total of 10 and multiple images per mouse.\nOriginal
  magnification: 8000x\n\nThis dataset contains segmentation masks for the following
  semantic classes:\n- (myelinated) axon\n- (unmyelinated) axon\n- myelin\n- oligodendrocyte
  nucleus\n- oligodendrocyte process"
